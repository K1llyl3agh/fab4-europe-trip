<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FAB4 Connections Audit - Print</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#525659; }
  iframe { width:100%; height:100%; border:none; }
  .fallback { display:none; font-family:sans-serif; text-align:center; padding:40px; color:#fff; }
</style>
</head>
<body>
  <iframe id="pdfFrame" src="fab4-connections-audit.pdf" title="FAB4 Connections Audit"></iframe>
  <div class="fallback" id="fallbackMsg">
    If the print dialog doesn't open automatically, use your browser's Print button (Ctrl/Cmd+P) while viewing this PDF, or <a href="fab4-connections-audit.pdf" style="color:#9fd3ff;">open it directly here</a>.
  </div>
  <script>
    var frame = document.getElementById('pdfFrame');
    var printed = false;
    function tryPrint() {
      if (printed) return;
      printed = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (e) {
        window.print();
      }
      document.getElementById('fallbackMsg').style.display = 'block';
    }
    frame.addEventListener('load', function () {
      setTimeout(tryPrint, 500);
    });
    // Fallback in case load event doesn't fire as expected
    setTimeout(tryPrint, 2500);
  </script>
</body>
</html>
